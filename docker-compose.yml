services:
  redis:
    image: redis:8.8.0
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./.docker/redis:/data
    networks:
      - app-nest
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./.docker/postgres:/var/lib/postgresql
    networks:
      - app-nest
  app:
    build:
      context: .
      args:
        - PORT=${PORT}
    container_name: app
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    volumes:
      - ./:/app
    depends_on:
      - postgres
      - redis
    networks:
      - app-nest
networks:
  app-nest:
    driver: bridge
